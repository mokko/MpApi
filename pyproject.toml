[build-system]
requires = ["flit_core >=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "MpApi"
authors = [{name = "Maurice Mengel", email = "mauricemengel@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
dynamic = ["version", "description"]
keywords = ["museum", "museumPlus", "api client"]
# datetime should be included in Python
# typing_extensions makes newer typing features available to older Pythons 
dependencies = [
	"flit",
    "lxml >=4.8.0", #pathlike objects
    "requests >=2.6",
]
[project.optional-dependencies]
test = [
	"tomli >= 2.0.0", # only required for python_version < 3.11
    "pytest >=2.7.3",
]

[project.scripts]
mink = 'mpapi:mink'
getAttachments = 'mpapi:getAttachments'
getAttachment = 'mpapi:getAttachment'
getItem = 'mpapi:getItem'
getDefinition = 'mpapi:getDefinition'
updateItem = 'mpapi:updateItem'
validate = 'mpapi:validate'
filter = 'mpapi:filter'

[tool.flit.module]
# The package directory is src/mpapi (lower case). Flit looks for a folder
# matching the project name, so "MpApi" only resolves on a file system that
# ignores case — on Linux the build fails with "No file/folder found for
# module MpApi". Naming the module here fixes that.
name = "mpapi"

[tool.flit.sdist]
include = ["src/mpapi/__init__.py"]